<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>PSG Campus Compass — 10 PSG institutions, one clean page</title>
<meta name="description" content="A compact guide to the 10 PSG institutions in Coimbatore — courses, closing cutoffs for three years, placements, student reviews and campus Q&A on one tidy page." />
<meta name="theme-color" content="#101d38" />
<style>
:root{
  --navy:#101d38; --navy2:#1a2c52; --gold:#e3a93f; --gold2:#f3cd80;
  --bg:#f5f7fb; --card:#fff; --ink:#0f1a2e; --mut:#68789a; --line:#e3e9f3;
  --ok:#1d6b41; --okbg:#e8f6ee; --warn:#8a5a10; --warnbg:#fdf3e3; --bad:#a33b32; --badbg:#fdecea;
  --r:14px; --shadow:0 1px 2px rgba(15,26,46,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.012em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.mut{color:var(--mut)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.top__in{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand__mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--gold2),var(--gold));
  color:#3a2606;font-weight:800;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
.brand b{display:block;font-size:14.5px;line-height:1.15}
.brand small{color:#a9b7d6;font-size:11.5px}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);font-size:15px;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1.5px solid var(--navy)}
.userchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);font-size:12.5px}
.userchip i{width:24px;height:24px;border-radius:50%;background:linear-gradient(140deg,var(--gold2),var(--gold));
  color:#3a2606;font-weight:800;font-size:11px;display:grid;place-items:center;font-style:normal}

/* ---------- login ---------- */
.login{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:26px 16px 60px}
.login__card{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 24px 24px;box-shadow:0 20px 44px -34px rgba(16,29,56,.5)}
.login__card h1{font-size:21px}
.login__card .sub{margin-top:7px;color:var(--mut);font-size:13.5px}
.f{margin-top:16px}
.f label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.f input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.f input:focus{outline:2px solid rgba(227,169,63,.55);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  padding:11px 16px;font-weight:700;font-size:13.5px;border:1px solid transparent}
.btn--gold{background:linear-gradient(140deg,var(--gold2),var(--gold));color:#3a2606}
.btn--navy{background:var(--navy);color:#fff}
.btn--ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn--ghost:hover{border-color:#cfd8e8}
.btn--block{width:100%;margin-top:16px}
.demo{margin-top:18px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;background:#fbfcfe}
.demo b{font-size:12.5px}
.demo code{display:block;margin-top:7px;font-size:12.5px;color:var(--ink)}
.demo code em{font-style:normal;display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.demo .btn{margin-top:10px}
.legal{margin-top:14px;font-size:11.5px;color:var(--mut);line-height:1.5}

/* ---------- list ---------- */
.head{padding:16px 0 6px}
.head h2{font-size:19px}
.head p{margin-top:5px;color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;color:var(--mut)}
.search input{border:0;outline:0;background:none;width:100%;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:650;color:#43506b}
.chip.on{background:linear-gradient(140deg,var(--gold2),var(--gold));border-color:transparent;color:#3a2606}
.chip .cnt{font-variant-numeric:tabular-nums;opacity:.75}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 2px}
.strip div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.strip b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.strip span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700}
.list{display:grid;gap:9px;margin:12px 0 26px}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:.14s ease;box-shadow:var(--shadow)}
.row:hover{border-color:#cdd8ea;transform:translateY(-1px)}
.row__mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,#16274a,#0f1c34);color:var(--gold2);
  display:grid;place-items:center;font-weight:800;font-size:12px;text-align:center;line-height:1.05;padding:2px}
.row__t b{display:block;font-size:14.6px;line-height:1.3}
.row__t .meta{display:block;margin-top:3px;font-size:12.1px;color:var(--mut)}
.row__pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.4px;font-weight:700}
.pill--rate{background:#fff6e4;color:#8a5c10;border:1px solid #f6e2ba}
.pill--fee{background:#eef3fd;color:#22345c;border:1px solid #dbe5f7}
.pill--ok{background:var(--okbg);color:var(--ok);border:1px solid #c9ecd8}
.pill--warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3dfc6}
.pill--bad{background:var(--badbg);color:var(--bad);border:1px solid #f6d3cf}
.pill--up{background:var(--okbg);color:var(--ok)}
.pill--down{background:var(--badbg);color:var(--bad)}
.pill--flat{background:#eef1f7;color:#54617a}
.pill--high{background:#e8f5ec;color:#1d6b3a;border:1px solid #bfe3cc}
.pill--mid{background:#fdf3e0;color:#8a6a1f;border:1px solid #f0dcae}
.pill--low{background:#fdecec;color:#9b2c2c;border:1px solid #f3c9c9}
.pill--near{background:#eaf0fb;color:#26417a;border:1px solid #c7d7f2}
.row__side{display:grid;gap:6px;justify-items:end;flex:0 0 auto}
.star{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px}
.star.on{background:#fff6e4;border-color:#f6e2ba}

/* ---------- detail ---------- */
.back{margin:14px 0 10px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);font-weight:650}
.back:hover{color:var(--ink)}
.hero{background:linear-gradient(140deg,#16274a 0%,var(--navy) 55%,#0c1730 100%);color:#fff;border-radius:18px;
  padding:20px 22px;box-shadow:0 22px 46px -34px rgba(16,29,56,.8)}
.hero__top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-size:21px}
.hero .tag{margin-top:6px;color:#c3cfe9;font-size:13px;max-width:70ch}
.hero__chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero__chips span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);font-size:11.4px;font-weight:700}
.hero__side{margin-left:auto;display:grid;gap:8px;justify-items:end}
.hero__act{display:flex;gap:8px;flex-wrap:wrap}
.chatcard{margin-bottom:12px}
.chathead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chathead .spacer{flex:1}
.chatlog{display:flex;flex-direction:column;gap:9px;margin:12px 0;max-height:330px;overflow-y:auto;padding-right:2px}
.msg{max-width:86%;border-radius:14px;padding:10px 13px;font-size:13.1px;line-height:1.55;overflow-wrap:anywhere}
.msg--u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px;font-weight:600}
.msg--b{align-self:flex-start;background:#f2f5fa;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px}
.msg--b b{color:var(--ink)}
.msg--typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.msg--typing i{width:6px;height:6px;border-radius:50%;background:#9fb0cc;animation:blink 1s infinite}
.msg--typing i:nth-child(2){animation-delay:.18s}
.msg--typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.botlist{margin:6px 0 0;padding-left:17px;display:grid;gap:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip--ask{background:#fff;border:1px solid rgba(16,29,56,.18);font-size:11.8px;font-weight:700;color:var(--navy)}
.chip--ask:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.chatbar{display:flex;gap:8px}
.chatbar input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 13px;
  font-size:13.2px;background:#fff;color:var(--ink);font-family:inherit}
.chatbar input:focus{outline:2px solid rgba(227,169,63,.55);border-color:transparent}
@media (max-width:520px){.msg{max-width:94%}.chatbar{flex-wrap:wrap}.chatbar input{flex:1 1 100%}.chatbar .btn{width:100%}}
.loc{display:grid;gap:18px;grid-template-columns:1.02fr 1fr;align-items:start}
.loc__addr{font-weight:700;color:var(--ink);line-height:1.55;max-width:34ch}
.loc__dl{display:grid;gap:9px}
.loc__dl > div{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:baseline;min-width:0}
.loc__dl > div > span{font-size:10.8px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800}
.loc__dl b{font-size:13.2px;overflow-wrap:anywhere;min-width:0}
.loc__dl a{color:var(--navy);text-decoration:none;border-bottom:1px solid rgba(16,29,56,.25)}
.loc__tag{font-style:normal;font-size:9.8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#8a6a1f;background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.45);border-radius:999px;padding:2px 7px;white-space:nowrap}
.loc__act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.loc__map{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#eef2f8;min-height:100%}
.loc__map iframe{display:block;width:100%;height:100%;min-height:342px;border:0}
@media (max-width:780px){
  .loc{grid-template-columns:1fr}
  .loc__map iframe{min-height:260px}
}
.mq{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 0;margin-top:2px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent)}
.mq__track{display:flex;gap:12px;width:max-content;animation:mqRun 24s linear infinite}
.mq:hover .mq__track{animation-play-state:paused}
@keyframes mqRun{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.lg{display:flex;flex-direction:column;align-items:center;gap:6px;width:98px;flex:none}
.lg i{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;font-style:normal;
  font-weight:800;font-size:16px;letter-spacing:.03em;box-shadow:0 2px 6px rgba(16,29,56,.14)}
.lg i.lg__i{background:#fff;border:1px solid var(--line);color:var(--navy);overflow:hidden;padding:8px;box-shadow:0 1px 4px rgba(16,29,56,.10)}
.lg__i img{width:100%;height:100%;object-fit:contain;display:block}
.lg b{font-size:11.4px;font-weight:700;color:#4a5876;text-align:center;line-height:1.2;max-width:98px}
@media (prefers-reduced-motion: reduce){
  .mq__track{animation-duration:70s}
  .mq{overflow-x:auto}
}
@media (max-width:520px){.lg{width:82px}.lg i{width:46px;height:46px;font-size:15px}}
.gcards{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:780px){.gcards{grid-template-columns:1fr}}
.gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}
.gcard:hover{box-shadow:0 6px 18px rgba(16,29,56,.10)}
.gcard__t{display:flex;gap:12px;align-items:center}
.gcard__t b{display:block;font-size:15.6px;color:var(--ink)}
.gcard__t .mut{display:block;font-size:12.1px;margin-top:3px}
.gcard__badge{width:48px;height:48px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:12.4px;letter-spacing:.04em;flex:none}
.gcard p{font-size:12.8px;color:#4a5876;line-height:1.55;margin:11px 0 12px}
.gcard__f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.gcard__go{font-weight:800;font-size:12.7px;color:var(--navy)}
.grp{margin:0 0 18px}
.grp__h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.grp__h h3{font-size:16.5px;margin:0;color:var(--navy)}
.grp__h .mut{font-size:12.3px}
.form .frow{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.form .frow--3{grid-template-columns:1fr 1fr 1fr}
.f2{display:flex;flex-direction:column;gap:5px;min-width:0}
.f2 label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:800}
.f2 input{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:13.4px;
  font-family:inherit;color:var(--ink);background:#fff;min-width:0}
.f2 input:focus{outline:2px solid rgba(227,169,63,.55);border-color:transparent}
.ferr{color:var(--bad);font-size:11.6px;font-weight:700}
.cutline{background:#f2f5fa;border:1px dashed rgba(16,29,56,.25);border-radius:12px;padding:10px 13px;
  font-size:13.4px;color:var(--ink);margin:4px 0 12px}
.cutline b{font-size:17px;color:var(--navy)}
.formact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.formact .btn{height:42px}
.btn--sm{height:34px;padding:0 12px;font-size:12.4px;gap:6px}
@media (max-width:640px){.form .frow,.form .frow--3{grid-template-columns:1fr}}
.segrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;gap:4px;background:#eef2f8;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg__b{border:0;background:transparent;font-family:inherit;font-size:12.4px;font-weight:800;color:#4a5876;
  padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px}
.seg__b:hover:not([disabled]){color:var(--navy)}
.seg__b.on{background:var(--navy);color:#fff}
.seg__b[disabled]{opacity:.42;cursor:not-allowed}
.seg__b .seg__n{font-size:10.8px;font-weight:800;background:rgba(16,29,56,.10);color:inherit;border-radius:999px;padding:1px 6px}
.seg__b.on .seg__n{background:rgba(255,255,255,.22)}
.segrow__hint{font-size:12.2px}
.lvll{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.05em;border-radius:999px;padding:2px 6px;margin-left:4px;
  border:1px solid rgba(16,29,56,.22);color:#3d4b68;background:#f2f5fa}
.lvll--pg{border-color:rgba(227,169,63,.6);color:#8a6a1f;background:rgba(227,169,63,.14)}
@media (max-width:520px){.seg{width:100%;justify-content:space-between}.seg__b{flex:1;justify-content:center}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;padding-bottom:2px}
.tab{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.6px;font-weight:700;color:#43506b;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card h3{font-size:14.5px}
.card h4{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0 0 9px}
.grid2{display:grid;grid-template-columns:1.4fr .9fr;gap:12px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.kv div{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fbfcfe}
.kv span{display:block;font-size:10.6px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kv b{display:block;margin-top:3px;font-size:13.8px;font-variant-numeric:tabular-nums}
.hl{display:grid;gap:9px;margin-top:12px}
.hl div{border-left:3px solid var(--gold);padding:2px 0 2px 11px}
.hl b{display:block;font-size:13.4px}
.hl span{font-size:12.4px;color:var(--mut)}

/* tables */
.tbl{width:100%;border-collapse:collapse;margin-top:6px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;font-size:12.9px;border-bottom:1px solid var(--line)}
.tbl thead th{font-size:10.8px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td b{font-variant-numeric:tabular-nums}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.trend{display:inline-flex;align-items:center;gap:5px;font-weight:800}
.spark{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.spark i{width:5px;border-radius:2px;background:#cfd9ea;display:block}
.spark i:last-child{background:var(--navy)}

/* reviews */
.rate{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rate__big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.4px}
.bar__t{height:7px;border-radius:99px;background:#eef1f7;overflow:hidden}
.bar__t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff}
.rev + .rev{margin-top:9px}
.rev__h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rev__h b{font-size:13.8px}
.rev__h .tagx{font-size:11.6px;color:var(--mut)}
.rev__score{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:#8a5c10}
.rev p{margin-top:8px;font-size:13.2px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pc div{font-size:12.5px;border-radius:10px;padding:8px 10px}
.pc .p{background:var(--okbg);color:#175c37}
.pc .c{background:#fdf0ef;color:#8d332b}
.pc b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}

/* qa */
.qa summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13.4px;font-weight:650;display:flex;gap:9px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary:before{content:"Q";font-weight:800;color:var(--gold);flex:0 0 auto}
.qa p{padding:0 13px 12px 32px;font-size:13px;color:var(--mut)}
.qa[open]{background:#fbfcfe}

/* bell + toast */
.panel{position:fixed;top:64px;right:16px;width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 26px 50px -30px rgba(16,29,56,.55);padding:12px 13px;z-index:40;display:none}
.panel.on{display:block}
.panel h4{margin-bottom:8px}
.panel li{list-style:none;display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.8px}
.panel ul{margin:0;padding:0}
.panel li:last-child{border-bottom:0}
.panel li b{display:block;font-size:12.8px}
.panel li span{color:var(--mut);font-size:11.6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;
  border-radius:999px;padding:10px 18px;font-size:13px;box-shadow:0 18px 34px -20px rgba(16,29,56,.8);opacity:0;
  pointer-events:none;transition:.2s ease;z-index:50}
.toast.on{opacity:1;bottom:26px}
.foot{margin:26px 0 30px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;display:flex;
  gap:10px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:780px){
  .grid2{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .hero__side{margin-left:0;justify-items:start;width:100%}
  .bar{grid-template-columns:88px minmax(0,1fr) 30px}
}
@media (max-width:520px){
  .row{grid-template-columns:40px minmax(0,1fr);gap:10px}
  .row__side{grid-column:2;justify-items:start;display:flex;gap:8px}
  .pc{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}

function api(path, body) {
  if (typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
  return fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json(); });
}
function cutoffOf(p) {
  var pct = parseFloat(p && p.marks12);
  if (!isNaN(pct)) return Math.round(pct * 2 * 10) / 10;
  var m = parseFloat(p && p.math), ph = parseFloat(p && p.phy), ch = parseFloat(p && p.chem);
  if (isNaN(m) || isNaN(ph) || isNaN(ch)) return null;
  return Math.round((m + ph / 2 + ch / 2) * 10) / 10;
}
function topCutOf(c) {
  var best = null;
  c.courses.forEach(function (x) { if (x.cut && x.cut[2] != null && (best == null || x.cut[2] > best)) best = x.cut[2]; });
  return best;
}
function chanceOf(c) {
  var cut = cutoffOf(S.profile), t = topCutOf(c);
  if (cut == null || t == null) return null;
  var d = cut - t;
  if (d >= 3) return { k:'high', txt:'High chance' };
  if (d >= -5) return { k:'mid', txt:'Borderline' };
  return { k:'low', txt:'Tough' };
}
function nearMe(c) {
  var town = String((S.profile && S.profile.town) || '').toLowerCase().trim();
  if (town.length < 4) return false;
  var first = town.split(/[ ,]/)[0];
  if (first.length < 4) return false;
  var hay = (String(c.city || '') + ' ' + String((LOC[c.id] || {}).addr || '')).toLowerCase();
  return hay.indexOf(first) >= 0;
}

function lvlOf(x) {
  if (x.lvl) return x.lvl;

}

function trendOf(cut) {
  if (!cut || cut[0] == null) return { code:'flat', txt:'—', arrow:'·' };
  var a = cut[cut.length-3], b = cut[cut.length-2], d = cut[cut.length-1];
  if (d > b + .4) return { code:'up', txt:'rising', arrow:'↑' };
  if (d < b - .4) return { code:'down', txt:'easing', arrow:'↓' };
  return { code:'flat', txt:'steady', arrow:'→' };
}
function spark(cut) {
  var vals = cut.filter(function (x) { return x != null; });
  if (!vals.length) return '';
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  return '<span class="spark" aria-hidden="true">' + vals.map(function (v) {
    var h = max === min ? 10 : 5 + Math.round(((v - min) / (max - min)) * 9);
    return '<i style="height:' + h + 'px"></i>';
  }).join('') + '</span>';
}

    else if (shortP.length > 3 && q.indexOf(shortP) >= 0) score = 500 + shortP.length;
    else {
      var sw = shortP.split(' ').filter(function (w) { return w.length > 2; });
      var nw = nameP.split(' ').filter(function (w) { return w.length > 3; });
      var hs = 0, hn = 0;
      sw.forEach(function (w) { if (q.indexOf(w) >= 0) hs++; });
      nw.forEach(function (w) { if (q.indexOf(w) >= 0) hn++; });
      if (hn >= 2 || (hs >= 1 && hn >= 1) || hs >= 2) score = 100 + hn * 2 + hs;

  });
  return best;

function curatedMatch(c, q) {
  var words = q.split(' ').filter(function (w) { return w.length > 2; });
  var best = null, hitBest = 0, total = 0;
  c.qa.forEach(function (x) {
    var qw = norm(x[0]).split(' ').filter(function (w) { return w.length > 2; });
    var hit = 0;
    qw.forEach(function (w) { if (words.indexOf(w) >= 0) hit++; });
    if (hit > hitBest) { hitBest = hit; best = x; total = qw.length; }
  });
  return { pair: best, hit: hitBest, total: total, strong: (best && hitBest >= 2 && hitBest >= Math.ceil(total * 0.6)) };
}
function findCourse(c, q) {
  var best = null, bestScore = 0;
  c.courses.forEach(function (x) {
    var words = norm(x.n).split(' ');
    var score = 0;
    words.forEach(function (w) { if (w.length > 1 && q.indexOf(w) >= 0) score++; });
    if (hasAny(q, ['cse', 'computer']) && /computer/i.test(x.n)) score += 2;
    if (hasAny(q, ['it', 'information']) && /information/i.test(x.n)) score += 2;
    if (q.indexOf('ece') >= 0 && /electronics/i.test(x.n)) score += 2;
    if (q.indexOf('mech') >= 0 && /mechanical/i.test(x.n)) score += 2;
    if (q.indexOf('civil') >= 0 && /civil/i.test(x.n)) score += 2;
    if (q.indexOf('aids') >= 0 && /(ai|artificial)/i.test(x.n)) score += 2;
    if (score > bestScore) { bestScore = score; best = x; }
  });
  return bestScore > 0 ? best : null;
}

  setTimeout(function () {
    var a = botAnswer(c, v);
    S.typing = false; S.scrollChat = true;
    chatPush(c.id, 'b', a.text, a.chips);
    render();
  }, 430);
}

document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  if (/^f_/.test(e.target.id)) {
    ['name', 'phone', 'marks10', 'marks12', 'town'].forEach(function (k) {
      var el = document.getElementById('f_' + k);
      if (el) S.draft[k] = el.value;
    });
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'chatInput') { e.preventDefault(); chatSend(); return; }
  if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-grp')) {
    S.grp = e.target.getAttribute('data-grp'); S.q = ''; S.savedOnly = false; render(); return;
  }
});

render();
if (typeof fetch === 'function') {
  fetch('/api/health').then(function (r) { return r.json(); }).then(function (j) {
    S.backend = !!(j && j.ok);
    if (S.view === 'login') render();
  }).catch(function () { S.backend = false; if (S.view === 'login') render(); });
} else { S.backend = false; }
</script>
</body>
</html>
